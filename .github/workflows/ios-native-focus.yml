name: Aeon focused native diagnostics

# These focused jobs supplement, never replace, the full unsigned IPA release gate.
on:
  push:
    branches: ['chatgpt/aeon-ui-refinement']
    paths:
      - 'ios/**'
      - 'scripts/test-ios.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-native-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeon-native-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-native:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [iphone, ipad]
        suite: [LibraryFlowTests, AeonAccessibilityTests, AdaptiveChromeTests]
    name: ${{ matrix.family }} / ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync native dependencies
        run: npx cap sync ios
      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update
      - name: Run focused native suite
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          SUITE: ${{ matrix.suite }}
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/aeon-native-focus/result.xcresult
        run: |
          mkdir -p "$RUNNER_TEMP/aeon-native-focus"
          log="$RUNNER_TEMP/aeon-native-focus/native.log"
          # Preserve xcodebuild's exit status. Keep the complete log in the artifact,
          # but print a bounded failure summary instead of megabytes of UI snapshots.
          set +e
          npm run test:ios -- "--family=$FAMILY" "-only-testing:AppUITests/$SUITE" > "$log" 2>&1
          result=$?
          set -e
          summary="$RUNNER_TEMP/aeon-native-focus/summary.txt"
          {
            printf 'Commit: %s\nFamily: %s\nSuite: %s\nExit code: %s\n' "$GITHUB_SHA" "$FAMILY" "$SUITE" "$result"
            grep -E 'error:|XCTAssert|XCTFail|Test Case .* (failed|passed)|Executed .* tests|TEST (FAILED|SUCCEEDED)|shards (failed|passed)' "$log" | tail -n 150 || true
            printf '\n--- Final log lines ---\n'
            tail -n 40 "$log"
          } > "$summary"
          cat "$summary"
          {
            printf '### Focused native result\n\n```text\n'
            cat "$summary"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-focus-${{ matrix.family }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/aeon-native-focus/
          if-no-files-found: warn
          retention-days: 14
