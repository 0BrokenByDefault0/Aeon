name: Unsigned IPA (device build)

# The release gate in ios-ipa.yml runs the whole simulator matrix — two device
# families across the unit suite and every UI test class, eighteen xcodebuild
# invocations — and takes well over an hour. This job exists to put a build on a
# phone quickly. It compiles and packages the same commit, then runs the unit
# suite afterwards, so the artifact is always produced and the run still turns
# red if the unit tests fail.
#
# It supplements the release gate and never replaces it: an IPA from here has
# not been through the UI matrix.
#
# The release gate can do something similar on demand through its skip_tests
# and test_filter dispatch inputs. This job exists because workflow_dispatch
# only registers from the repository's default branch, which is not main; once
# main is the default, prefer dispatching the gate and retire this file.
on:
  # Dispatch only registers from the repository's default branch, so this also
  # runs on pushes to main, where the device build is wanted.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeon-ipa-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync web assets into the iOS shell
        run: npx cap sync ios

      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update

      # Stamped into the binary so an exported diagnostics log always names the
      # build it came from.
      - name: Stamp the build commit
        run: |
          /usr/libexec/PlistBuddy -c "Delete :AeonBuildCommit" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :AeonBuildCommit string $(git rev-parse --short HEAD)" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :AeonBuildCommit" ios/App/App/Info.plist

      - name: Build unsigned
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package as .ipa
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app was not produced"; ls -R build/Build/Products || true; exit 1; }
          echo "--- bundle root ---"
          ls -la "$APP"
          # Every face the app declares has to be in the bundle. Shipping an IPA
          # whose UIAppFonts names a file that is not there means the app falls
          # back to the system font on device and nothing says so.
          MISSING=0
          for FONT in $(/usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$APP/Info.plist" | sed -n 's/^ *\([^ ].*\)$/\1/p' | grep -v '^Array' | grep -v '^[{}]$'); do
            if [ ! -f "$APP/$FONT" ]; then echo "MISSING FROM BUNDLE: $FONT"; MISSING=1; fi
          done
          [ "$MISSING" -eq 0 ] || { echo "Declared fonts are missing from the bundle."; exit 1; }
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PACKAGE_OUTPUT="$PWD/Aeon-5.0-$SHORT_SHA-unsigned.ipa"
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP" "$PACKAGE_ROOT/Payload/"
          (cd "$PACKAGE_ROOT" && zip -qry "$PACKAGE_OUTPUT" Payload)
          ls -lh Aeon-5.0-*-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-unsigned-ipa
          path: ios/App/Aeon-5.0-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # After packaging, so a red unit suite is visible without withholding the
      # build someone is waiting on.
      - name: Verify unit suite
        env:
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/Aeon-5.0-fast.xcresult
        run: npm run test:ios:iphone -- -only-testing:AppTests

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-fast-xcresult
          path: ${{ runner.temp }}/Aeon-5.0-fast*.xcresult
          if-no-files-found: ignore
          retention-days: 30
