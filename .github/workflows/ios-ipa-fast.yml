name: Unsigned IPA (device build)

# The release gate in ios-ipa.yml runs the whole simulator matrix — two device
# families across the unit suite and every UI test class, eighteen xcodebuild
# invocations — and takes well over an hour. This job exists to put a build on a
# phone quickly. It compiles and packages the same commit, then runs the unit
# suite afterwards, so the artifact is always produced and the run still turns
# red if the unit tests fail.
#
# It supplements the release gate and never replaces it: an IPA from here has
# not been through the UI matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeon-ipa-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync web assets into the iOS shell
        run: npx cap sync ios

      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build unsigned
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package as .ipa
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app was not produced"; ls -R build/Build/Products || true; exit 1; }
          PACKAGE_OUTPUT="$PWD/Aeon-5.0-unsigned.ipa"
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP" "$PACKAGE_ROOT/Payload/"
          (cd "$PACKAGE_ROOT" && zip -qry "$PACKAGE_OUTPUT" Payload)
          ls -lh Aeon-5.0-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-unsigned-ipa
          path: ios/App/Aeon-5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # After packaging, so a red unit suite is visible without withholding the
      # build someone is waiting on.
      - name: Verify unit suite
        env:
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/Aeon-5.0-fast.xcresult
        run: npm run test:ios:iphone -- -only-testing:AppTests

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-fast-xcresult
          path: ${{ runner.temp }}/Aeon-5.0-fast*.xcresult
          if-no-files-found: ignore
          retention-days: 30
