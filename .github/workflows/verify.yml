name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aeon-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bounded deterministic verification
        timeout-minutes: 11
        run: |
          python3 scripts/validation-deadline.py --stage "Verify deterministic checks" --report verify-deadline.json -- bash -c 'set -euo pipefail; npm test; npm run check; npm audit --audit-level=high'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Aeon-verify-deadline-${{ github.run_id }}
          path: verify-deadline.json
          if-no-files-found: ignore
