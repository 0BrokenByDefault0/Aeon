name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aeon-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bounded deterministic verification
        timeout-minutes: 11
        run: |
          python3 scripts/validation-deadline.py --stage "Verify deterministic checks" --report verify-deadline.json -- bash -c 'set -euo pipefail; npm test; npm run check; npm audit --audit-level=high'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aeon-verify-deadline-${{ github.run_id }}
          path: verify-deadline.json
          if-no-files-found: ignore
