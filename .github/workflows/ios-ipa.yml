name: Build unsigned IPA

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'test/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Build the .ipa without the test suite. Manual runs only.'
        type: boolean
        default: false
      test_filter:
        description: 'Run only these tests. Manual runs only.'
        type: string
        default: ''

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "AEON_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "AEON_BUILD_SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          echo "AEON_BUILD_RUN=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building commit ${GITHUB_SHA} from ${GITHUB_REF_NAME}, run ${GITHUB_RUN_NUMBER}"
          git status --short
          git rev-parse HEAD

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify playback and library regressions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: |
          npm test
          npm run check
          npx playwright install chromium
          npm run test:browser
          npm run test:interface:ci
          npm run test:arrival
          npm run test:sky-chrome
          npm run test:native-audio
          npm run test:legacy-migration

      - name: Sync migration assets into the iOS shell
        run: |
          npx cap sync ios
          cmp app/legacy-migration.html ios/App/App/public/legacy-migration.html
          cmp app/legacy-migration.js ios/App/App/public/legacy-migration.js

      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Verify native tests
        id: native_tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        continue-on-error: true
        env:
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/Aeon-5.0.xcresult
        shell: bash
        run: |
          set +e
          npm run test:ios -- ${{ inputs.test_filter }}
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Surface native test failure summary
        if: ${{ always() && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          bundles=("${RUNNER_TEMP}"/Aeon-5.0-*.xcresult "${RUNNER_TEMP}"/Aeon-5.0.xcresult)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo 'No xcresult bundle found; native test command failed before producing test evidence.'
            exit 0
          fi
          for bundle in "${bundles[@]}"; do
            [ -d "$bundle" ] || continue
            echo "::group::Native test summary — $(basename "$bundle")"
            xcrun xcresulttool get test-results summary --path "$bundle" || true
            echo '::endgroup::'
            echo "::group::Native test tree — $(basename "$bundle")"
            xcrun xcresulttool get test-results tests --path "$bundle" || true
            echo '::endgroup::'
          done

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-xcresult-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/Aeon-5.0-*.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Build unsigned device-test app
        working-directory: ios/App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Stamp and verify built app identity
        working-directory: ios/App
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/App.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AEON R${GITHUB_RUN_NUMBER}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :AeonBuildCommit string ${GITHUB_SHA}" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :AeonBuildCommit ${GITHUB_SHA}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :AeonBuildRun string ${GITHUB_RUN_NUMBER}" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :AeonBuildRun ${GITHUB_RUN_NUMBER}" "$PLIST"
          echo '--- Packaged app identity ---'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :AeonBuildCommit' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :AeonBuildRun' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AeonBuildCommit' "$PLIST")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AeonBuildRun' "$PLIST")" = "$GITHUB_RUN_NUMBER"
          printf 'commit=%s\nrun=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > "$APP/AEON_BUILD_IDENTITY.txt"

      - name: Package uniquely named IPA
        working-directory: ios/App
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/App.app"
          PACKAGE_OUTPUT="$PWD/Aeon-5.0-run-${GITHUB_RUN_NUMBER}-${AEON_BUILD_SHORT_SHA}-unsigned.ipa"
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP" "$PACKAGE_ROOT/Payload/"
          (cd "$PACKAGE_ROOT" && zip -qry "$PACKAGE_OUTPUT" Payload)
          unzip -p "$PACKAGE_OUTPUT" Payload/App.app/AEON_BUILD_IDENTITY.txt
          ls -lh "$PACKAGE_OUTPUT"

      - name: Upload uniquely identified device-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-run-${{ github.run_number }}-${{ github.sha }}-unsigned-ipa
          path: ios/App/Aeon-5.0-run-${{ github.run_number }}-${{ env.AEON_BUILD_SHORT_SHA }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Enforce native test gate
        if: ${{ always() && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::error::Native iOS tests failed. The uploaded IPA is for physical-device diagnosis/testing only and is not release-qualified.'
          exit 1
