name: Build fast unsigned IPA

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'test/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      areas:
        description: 'Comma-separated areas: import, playback, library, sky, chrome, playlists, settings'
        type: string
        default: 'import,playback,library,sky,chrome,playlists,settings'
      skip_native:
        description: 'Skip post-upload simulator validation; the fast IPA is always delivered first'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aeon-fast-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Plan changed-area validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_AREAS: ${{ inputs.areas }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            route=(--area="$REQUESTED_AREAS")
            echo "route_kind=areas" >> "$GITHUB_OUTPUT"
            echo "route_value=$REQUESTED_AREAS" >> "$GITHUB_OUTPUT"
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
            route=(--changed-from="$base")
            echo "route_kind=base" >> "$GITHUB_OUTPUT"
            echo "route_value=$base" >> "$GITHUB_OUTPUT"
          fi
          node scripts/test-targeted.mjs "${route[@]}" --tier=native --json > "$RUNNER_TEMP/targeted-plan.json"
          node -e '
            const p=require(process.argv[1]);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,`areas=${p.areas.join(",")||"configuration-only"}\nnative_required=${p.commands.length>0}\n`);
          ' "$RUNNER_TEMP/targeted-plan.json"
          node scripts/test-targeted.mjs "${route[@]}" --tier=native --list

      - name: Run cheap targeted checks
        shell: bash
        env:
          ROUTE_KIND: ${{ steps.plan.outputs.route_kind }}
          ROUTE_VALUE: ${{ steps.plan.outputs.route_value }}
        run: |
          set -euo pipefail
          if [[ "$ROUTE_KIND" == "areas" ]]; then route=(--area="$ROUTE_VALUE"); else route=(--changed-from="$ROUTE_VALUE"); fi
          node --test tests/ipa-delivery-workflow.test.cjs
          node --test tests/orbital-ui-contract.test.cjs
          node scripts/test-targeted.mjs "${route[@]}" --tier=cheap

      - name: Sync native project
        run: npx cap sync ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install locked pods
        working-directory: ios/App
        run: pod install

      - name: Build unsigned app
        shell: bash
        working-directory: ios/App
        env:
          DERIVED_DATA: ${{ runner.temp }}/AeonDerivedData
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeon-fast"
          log="$RUNNER_TEMP/aeon-fast/xcodebuild.log"
          set +e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" > "$log" 2>&1
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then grep -E 'error:|warning:|BUILD (FAILED|SUCCEEDED)' "$log" | tail -n 160 || true; tail -n 50 "$log"; exit "$result"; fi
          grep -E 'warning:|BUILD SUCCEEDED' "$log" | tail -n 80 || true

      - name: Package and label unsigned IPA
        shell: bash
        working-directory: ios/App
        env:
          AREAS: ${{ steps.plan.outputs.areas }}
          NATIVE_REQUIRED: ${{ steps.plan.outputs.native_required }}
          NATIVE_SKIPPED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_native }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeon-fast"
          app="$RUNNER_TEMP/AeonDerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          if [[ "$NATIVE_SKIPPED" == "true" ]]; then native_result="SKIPPED by manual request"
          elif [[ "$NATIVE_REQUIRED" == "true" ]]; then native_result="PENDING; runs on one iPhone simulator after IPA upload"
          else native_result="NOT REQUIRED for configuration-only change"; fi
          manifest="$RUNNER_TEMP/aeon-fast/Aeon-validation.txt"
          {
            printf 'Aeon fast iteration IPA\n'
            printf 'Commit: %s\nAreas: %s\n' "$GITHUB_SHA" "$AREAS"
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Cheap targeted checks: PASSED\nFocused native validation: %s\n' "$native_result"
            printf 'Deep regression matrix: NOT RUN\nPhysical-device acceptance: NOT RUN\n'
            printf 'Release status: ITERATION ONLY\n'
          } | tee "$manifest"
          cp "$manifest" "$app/Aeon-validation.txt"
          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          mkdir -p "$package_root/Payload"
          cp -R "$app" "$package_root/Payload/"
          (cd "$package_root" && zip -qry "$GITHUB_WORKSPACE/ios/App/Aeon-5.0-unsigned.ipa" Payload)
          test -s Aeon-5.0-unsigned.ipa
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 Aeon-5.0-unsigned.ipa | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload fast IPA
        id: upload_ipa
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-fast-${{ github.run_id }}
          path: |
            ios/App/Aeon-5.0-unsigned.ipa
            ${{ runner.temp }}/aeon-fast/Aeon-validation.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish IPA download link
        shell: bash
        env:
          IPA_URL: ${{ steps.upload_ipa.outputs.artifact-url }}
        run: |
          printf '\n## Fast IPA available\n[Download the unsigned iteration IPA](%s)\n\nNative validation is reported separately below; do not wait for it to download the IPA.\n' "$IPA_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture orbital UI review
        id: ui_review
        if: ${{ steps.upload_ipa.outcome == 'success' && steps.plan.outputs.native_required == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_native) }}
        shell: bash
        env:
          AEON_IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/AeonDerivedData
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/aeon-ui-review/review.xcresult
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeon-ui-review"
          set +e
          node scripts/test-ios.mjs --family=iphone \
            -only-testing:AppUITests/AdaptiveChromeTests/testOrbitalUIReviewEmptyScreensAndControls \
            -only-testing:AppUITests/AdaptiveChromeTests/testOrbitalUIReviewSkyWithOneAlbum \
            -only-testing:AppUITests/AdaptiveChromeTests/testOrbitalDockBoundsAfterAX5EmptyStateNavigation \
            > "$RUNNER_TEMP/aeon-ui-review/review.log" 2>&1
          result=$?
          set -e
          grep -E 'error:|XCTAssert|XCTFail|Test Case .* (failed|passed)|Executed .* tests|TEST (FAILED|SUCCEEDED)' "$RUNNER_TEMP/aeon-ui-review/review.log" | tail -n 100 || true
          exit "$result"

      - name: Export orbital UI screenshots
        if: ${{ always() && steps.ui_review.outcome != 'skipped' && steps.upload_ipa.outcome == 'success' }}
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.ui_review.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aeon-ui-review"
          mkdir -p "$root/screenshots"
          printf 'Aeon native simulator UI review\nCommit: %s\nRun: %s\nUI review: %s\nPhysical-device acceptance: NOT RUN\nRelease status: ITERATION ONLY\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$REVIEW_OUTCOME" > "$root/review-manifest.txt"
          test -d "$root/review.xcresult"
          xcrun xcresulttool export attachments --path "$root/review.xcresult" --output-path "$root/screenshots"

      - name: Upload orbital UI screenshots
        if: ${{ always() && steps.ui_review.outcome != 'skipped' && steps.upload_ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-orbital-ui-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aeon-ui-review/screenshots
            ${{ runner.temp }}/aeon-ui-review/review-manifest.txt
            ${{ runner.temp }}/aeon-ui-review/review.log
          if-no-files-found: error
          retention-days: 14

      - name: Run focused native validation
        id: native
        if: ${{ always() && steps.upload_ipa.outcome == 'success' && steps.plan.outputs.native_required == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_native) }}
        shell: bash
        env:
          ROUTE_KIND: ${{ steps.plan.outputs.route_kind }}
          ROUTE_VALUE: ${{ steps.plan.outputs.route_value }}
          AEON_IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/AeonDerivedData
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/aeon-fast/result.xcresult
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aeon-fast"
          if [[ "$ROUTE_KIND" == "areas" ]]; then route=(--area="$ROUTE_VALUE"); else route=(--changed-from="$ROUTE_VALUE"); fi
          set +e
          node scripts/test-targeted.mjs "${route[@]}" --tier=native --family=iphone > "$RUNNER_TEMP/aeon-fast/native.log" 2>&1
          result=$?
          set -e
          {
            grep -E 'error:|XCTAssert|XCTFail|Test Case .* (failed|passed)|Executed .* tests|TEST (FAILED|SUCCEEDED)|shards (failed|passed)' "$RUNNER_TEMP/aeon-fast/native.log" | tail -n 160 || true
            printf '\nFinal log lines:\n'
            tail -n 50 "$RUNNER_TEMP/aeon-fast/native.log"
          } | tee "$RUNNER_TEMP/aeon-fast/native-summary.txt"
          exit "$result"

      - name: Report post-upload native validation
        if: ${{ always() && steps.upload_ipa.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          NATIVE_REQUIRED: ${{ steps.plan.outputs.native_required }}
          NATIVE_SKIPPED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_native }}
          IPA_URL: ${{ steps.upload_ipa.outputs.artifact-url }}
        run: |
          set -euo pipefail
          case "$NATIVE_OUTCOME" in
            success) native_result="PASSED on one iPhone simulator" ;;
            failure) native_result="FAILED; uploaded IPA remains available for iteration" ;;
            cancelled) native_result="CANCELLED; uploaded IPA is not native-validated" ;;
            *)
              if [[ "$NATIVE_SKIPPED" == "true" ]]; then native_result="SKIPPED by manual request"
              elif [[ "$NATIVE_REQUIRED" != "true" ]]; then native_result="NOT REQUIRED for configuration-only change"
              else native_result="NOT RUN; uploaded IPA is not native-validated"; fi ;;
          esac
          {
            printf 'Aeon post-upload validation\nCommit: %s\n' "$GITHUB_SHA"
            printf 'IPA artifact: %s\nFocused native validation: %s\n' "$IPA_URL" "$native_result"
            printf 'Deep regression matrix: NOT RUN\nPhysical-device acceptance: NOT RUN\nRelease status: ITERATION ONLY\n'
          } | tee "$RUNNER_TEMP/aeon-fast/Aeon-native-validation.txt"
          printf '\n## Post-upload native validation\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/aeon-fast/Aeon-native-validation.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native validation report
        if: ${{ always() && steps.upload_ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-fast-native-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aeon-fast/Aeon-native-validation.txt
            ${{ runner.temp }}/aeon-fast/native-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload focused failure evidence
        if: failure() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-fast-native-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aeon-fast/native-summary.txt
            ${{ runner.temp }}/aeon-fast/*.xcresult
          if-no-files-found: warn
          retention-days: 7
