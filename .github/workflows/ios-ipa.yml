name: Build unsigned IPA

# Apple only allows iOS binaries to be produced on macOS, so the build runs
# on a hosted Mac. The result is an UNSIGNED .ipa: it cannot be installed
# by double-clicking, but it is exactly what sideloading tools (AltStore,
# SideStore, Sideloadly) expect — they sign it with your own Apple ID on
# your own machine, which is the only way an unsigned build can ever run.
on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'test/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Build the .ipa without the test suite. Manual runs only, for getting a build onto a device when an unrelated test is red.'
        type: boolean
        default: false
      test_filter:
        description: 'Run only these tests, e.g. "--family=iphone -only-testing:AppUITests/LibraryFlowTests". Manual runs only; a full run takes over an hour, which is a slow way to debug one shard.'
        type: string
        default: ''

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify playback and library regressions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: |
          npm test
          npm run check
          npx playwright install chromium
          npm run test:browser
          npm run test:interface:ci
          npm run test:arrival
          npm run test:sky-chrome
          npm run test:native-audio
          npm run test:legacy-migration

      - name: Sync migration assets into the iOS shell
        run: |
          npx cap sync ios
          cmp app/legacy-migration.html ios/App/App/public/legacy-migration.html
          cmp app/legacy-migration.js ios/App/App/public/legacy-migration.js

      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Verify native tests
        id: native_tests
        # Keep executing the complete native suite, but record its exit code so a
        # device-test build can still be produced while we diagnose a UI-test red.
        # This is not release sign-off: the job is marked failed after packaging.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        continue-on-error: true
        env:
          AEON_IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/Aeon-5.0.xcresult
        shell: bash
        run: |
          set +e
          npm run test:ios -- ${{ inputs.test_filter }}
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Surface native test failure summary
        if: ${{ always() && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          bundles=("${RUNNER_TEMP}"/Aeon-5.0-*.xcresult "${RUNNER_TEMP}"/Aeon-5.0.xcresult)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo 'No xcresult bundle found; native test command failed before producing test evidence.'
            exit 0
          fi
          for bundle in "${bundles[@]}"; do
            [ -d "$bundle" ] || continue
            echo "::group::Native test summary — $(basename "$bundle")"
            xcrun xcresulttool get test-results summary --path "$bundle" || true
            echo '::endgroup::'
            echo "::group::Native test tree — $(basename "$bundle")"
            xcrun xcresulttool get test-results tests --path "$bundle" || true
            echo '::endgroup::'
          done

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-xcresult
          path: ${{ runner.temp }}/Aeon-5.0-*.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Build unsigned device-test IPA
        # A native UI-test failure no longer prevents a physical-device build.
        # Earlier setup/regression failures still stop the job normally.
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package as .ipa
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app was not produced"; ls -R build/Build/Products || true; exit 1; }
          PACKAGE_OUTPUT="$PWD/Aeon-5.0-unsigned.ipa"
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$APP" "$PACKAGE_ROOT/Payload/"
          (cd "$PACKAGE_ROOT" && zip -qry "$PACKAGE_OUTPUT" Payload)
          ls -lh Aeon-5.0-unsigned.ipa

      - name: Upload unsigned device-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aeon-5.0-unsigned-ipa
          path: ios/App/Aeon-5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Enforce native test gate
        if: ${{ always() && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::error::Native iOS tests failed. The uploaded IPA is for physical-device diagnosis/testing only and is not release-qualified.'
          exit 1
