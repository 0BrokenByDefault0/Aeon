name: Validate Sky name clearance

# One-off validation on an isolated branch. This workflow is not promoted
# into the UI PR; only the tested source and regression-test blobs are.
on:
  push:
    branches: ['repair/sky-name-clearance-13dd0baa']
    paths: ['.github/workflows/sky-clearance-validation.yml']

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == '0BrokenByDefault0/Aeon' && github.ref == 'refs/heads/repair/sky-name-clearance-13dd0baa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reproduce the existing name-clearance defect
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:app/index.html)" = 'ffaa1f6ee79c5388f5a3a64e4c5928ec236d7d98'
          cat > tests/sky-world-clearance.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          // Exercise the shipped placement predicate, not a second implementation.
          const html = fs.readFileSync(path.join(__dirname, '../app/index.html'), 'utf8');
          const predicate = html.match(/const clearOfSky=\(x,y,r\)=>regions\.every\(G=>\{[\s\S]*?\n    \}\);/);
          const squash = html.match(/const SQ=([\d.]+);/);
          assert.ok(predicate, 'the production world-clearance predicate must be present');
          assert.ok(squash, 'the production sky squash must be present');
          const SQ = Number(squash[1]);
          function clearance(regions) {
            return vm.runInNewContext(`${predicate[0]}\nclearOfSky`, { regions, SQ, Math });
          }
          const region = { lx: 0, ly: 0, r: 500 };

          test('a world cannot overlap a genre name with its lower edge', () => {
            const world = { x: 400, y: -690, r: 150 };
            // This clears the region itself but intersects the existing browser
            // suite's name band. Fractional-radius padding incorrectly allowed it.
            assert.ok(Math.hypot(world.x, world.y) > region.r * 1.12 + world.r + 70);
            const top = region.ly - region.r * SQ;
            assert.ok(Math.abs(world.x - region.lx) < region.r * .9);
            assert.ok(world.y < top + world.r && world.y > top - 110 - world.r);
            assert.equal(clearance([region])(world.x, world.y, world.r), false);
          });

          test('a world cannot overlap a genre name with its side', () => {
            assert.ok(Math.hypot(600, -500) > region.r * 1.12 + 150 + 70);
            assert.equal(clearance([region])(600, -500, 150), false);
            assert.equal(clearance([region])(-600, -500, 150), false);
          });

          test('worlds beyond the full name clearance remain eligible', () => {
            const free = clearance([region]);
            assert.equal(free(400, -731, 150), true);
            assert.equal(free(626, -500, 150), true);
            assert.equal(free(-626, -500, 150), true);
          });

          test('region clearance and empty skies retain their behavior', () => {
            assert.equal(clearance([region])(0, 0, 150), false);
            assert.equal(clearance([region])(0, 779, 150), false);
            assert.equal(clearance([region])(0, 781, 150), true);
            assert.equal(clearance([])(0, 0, 150), true);
          });

          test('name clearance follows translated regions and checks every region', () => {
            const moved = { lx: 1300, ly: -850, r: 500 };
            for (const regions of [[region, moved], [moved, region]]) {
              assert.equal(clearance(regions)(moved.lx + 400, moved.ly - 690, 150), false);
            }
          });

          test('accepted placements clear whole world bounds across sizes and positions', () => {
            let accepted = 0;
            for (const size of [152, 500, 1000]) {
              const G = { lx: 127, ly: -83, r: size };
              const free = clearance([G]);
              const top = G.ly - G.r * SQ;
              for (const radius of [124, 150, 187]) {
                for (let dx = -size - 400; dx <= size + 400; dx += 19) {
                  for (let dy = -size - 400; dy <= size + 400; dy += 23) {
                    const x = G.lx + dx, y = G.ly + dy;
                    if (!free(x, y, radius)) continue;
                    accepted++;
                    assert.ok(Math.hypot(dx, dy) >= G.r + radius);
                    const overlapsName = Math.abs(dx) < G.r * .95 + radius
                      && y < top + radius && y > top - 130 - radius;
                    assert.equal(overlapsName, false,
                      JSON.stringify({ region: G, world: { x, y, r: radius } }));
                  }
                }
              }
            }
            assert.ok(accepted > 100, 'the guard must still allow usable empty sky');
          });
          EOF
          if node --test tests/sky-world-clearance.test.cjs > "$RUNNER_TEMP/sky-clearance-baseline.log" 2>&1; then
            echo '::error::The baseline unexpectedly passed; investigate before changing source.'
            exit 1
          fi
          cat "$RUNNER_TEMP/sky-clearance-baseline.log"
          grep -Fq 'not ok 1 - a world cannot overlap a genre name with its lower edge' "$RUNNER_TEMP/sky-clearance-baseline.log"
          grep -Fq 'not ok 2 - a world cannot overlap a genre name with its side' "$RUNNER_TEMP/sky-clearance-baseline.log"

      - name: Apply the minimal full-radius clearance fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('app/index.html')
          source = file.read_text()
          old = '''      const overhead=Math.abs(x-G.lx)<G.r*.95+r*.6;
                return!(overhead&&y<G.ly-G.r*SQ+r*.4&&y>G.ly-G.r*SQ-130-r*.5);'''
          new = '''      // Reserve the whole world, not a fraction of its radius, around names.
                const overhead=Math.abs(x-G.lx)<G.r*.95+r;
                return!(overhead&&y<G.ly-G.r*SQ+r&&y>G.ly-G.r*SQ-130-r);'''
          assert source.count(old) == 1, 'Expected exactly one unchanged placement predicate'
          file.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- app/index.html | tee "$RUNNER_TEMP/sky-clearance.patch"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate all unit regressions and syntax without skipping tests
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/sky-clearance-tests.log"
          npm run check | tee "$RUNNER_TEMP/sky-clearance-syntax.log"
          git diff --check

      - name: Publish validated immutable blobs without moving a branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const blobs = {};
            for (const path of ['app/index.html', 'tests/sky-world-clearance.test.cjs']) {
              const result = await github.rest.git.createBlob({
                ...context.repo,
                content: fs.readFileSync(path, 'utf8'),
                encoding: 'utf-8'
              });
              blobs[path] = result.data.sha;
            }
            core.info('VALIDATED_BLOBS ' + JSON.stringify(blobs));
            await core.summary.addHeading('Sky clearance validation')
              .addRaw('Baseline reproduced the full-radius name overlap. All unit regressions and syntax checks passed after the minimal fix. No existing workflows or tests were disabled. No PR branch was moved.\n')
              .addCodeBlock(JSON.stringify(blobs, null, 2), 'json').write();

      - name: Preserve before-and-after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-clearance-validation
          path: |
            ${{ runner.temp }}/sky-clearance-*.log
            ${{ runner.temp }}/sky-clearance.patch
          if-no-files-found: error
          retention-days: 14
